<div class="slide-container" data-screen-label="04 Parameters Service Delivery">

  <div data-object="true" data-object-type="textbox" style="position:absolute; left:60px; top:25px; width:1160px; text-align:center; font-size:22px; font-weight:700; color:#000; line-height:1.3;">
    Parameters of service delivery would you consider in measuring benefits arising from IT project implementation
  </div>

  <div data-object="true" data-object-type="chart" style="position:absolute; left:30px; top:100px; width:1220px; height:610px;">
    <canvas id="c4" width="1525" height="762" style="display: block; box-sizing: border-box; height: 610px; width: 1220px;"></canvas>
  </div>

</div>
<script>
Chart.register(ChartDataLabels);
const labels = [
  'Customer feedback',
  'Efficiency',
  'Complaint Levels',
  'TAT for services/processes',
  'Access/Availability',
  'Simplicity(Ease of use)',
  'System uptime/downtime',
  'Customer numbers',
  'Error rate',
  'Satisfaction levels',
  'Number of service channels',
  'Sales volume',
  'Product quality features'
];
const values = [20,13,13,13,7,7,7,7,7,7,7,7,7];
const counts = [3,2,2,2,1,1,1,1,1,1,1,1,1];
const colors = ['#F5A623','#F28066','#EE3F3C','#EE3F3C','#3F1E1E','#A33A2D','#E07A3B','#F5C77E','#F0A89A','#EE7E6E','#F28A78','#A33A2D','#A33A2D'];

new Chart(document.getElementById('c4'), {
  type: 'bar',
  data: {
    labels: labels,
    datasets: [{
      data: values,
      backgroundColor: colors,
      borderWidth: 0,
      barPercentage: 0.8
    }]
  },
  options: {
    indexAxis: 'y',
    responsive: true,
    maintainAspectRatio: false,
    layout: { padding: { right: 60, left: 10, top: 10, bottom: 10 } },
    plugins: {
      legend: { display: false },
      tooltip: { enabled: false },
      datalabels: {
        anchor: 'end', align: 'end', color: '#000', font: { size: 12 },
        formatter: (v, ctx) => `${v}% (${counts[ctx.dataIndex]})`
      }
    },
    scales: {
      x: {
        min: 0, max: 22,
        ticks: { stepSize: 2, color: '#000', font: { size: 12 }, callback: v => v + '%' },
        grid: { color: '#D9D9D9', drawBorder: false }
      },
      y: {
        ticks: { color: '#000', font: { size: 12 }, autoSkip: false },
        grid: { display: false, drawBorder: false }
      }
    }
  }
});
</script>
